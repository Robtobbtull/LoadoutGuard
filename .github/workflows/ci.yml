# Builds and self-tests on every push and pull request.
# Pushing a tag like v1.0.0 also publishes a GitHub release with LoadoutGuard.exe attached.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed only to create the release on tags
    steps:
      - uses: actions/checkout@v5

      - name: Build and self-test
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: LoadoutGuard
          path: bin/LoadoutGuard.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" bin/LoadoutGuard.exe --title "${{ github.ref_name }}" --generate-notes
